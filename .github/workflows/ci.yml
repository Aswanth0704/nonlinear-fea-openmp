name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }} / OpenMP ${{ matrix.openmp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        openmp: [ON, OFF]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev libboost-dev libomp-dev

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DWOUND_ENABLE_OPENMP=${{ matrix.openmp }} \
            -DWOUND_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 2

      # ctest hides the output of passing tests, so surface the thread-by-thread
      # determinism result explicitly - it is the point of the OpenMP legs.
      - name: OpenMP determinism report
        if: matrix.openmp == 'ON'
        run: |
          {
            echo "### ${{ matrix.compiler }} / ${{ matrix.build_type }} / OpenMP ON"
            echo ""
            echo '```'
            ./build/tests/test_openmp_assembly | grep -vE '^(Element Iter|Going to create|X0 = |\.\.\. filled)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev libboost-dev libomp-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWOUND_ENABLE_OPENMP=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        working-directory: build-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --output-on-failure

  macos:
    name: macOS / AppleClang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install eigen boost libomp ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOUND_ENABLE_OPENMP=ON \
            -DOpenMP_ROOT="$(brew --prefix libomp)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
